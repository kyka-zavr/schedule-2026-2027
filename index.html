<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#0b0b0b">
	<title>Расписание занятий</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0b0b;
			--surface: #141414;
			--raised: #1d1d1d;
			--line: #2a2a2a;
			--ink: #f2f2f2;
			--muted: #8f8f8f;
			--white: #fff;
			--serif: Georgia, "Times New Roman", serif;
		}
		* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
		html { background: var(--bg); }
		body {
			margin: 0;
			min-height: 100dvh;
			color: var(--ink);
			background-color: var(--bg);
			background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
			background-size: 28px 28px;
			font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
		}
		button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
		button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

		.page { width: min(100% - 28px, 640px); margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom)); }

		.week { margin: 4px 2px 14px; }
		.week small { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
		.week h1 { margin: 4px 0 0; font-family: var(--serif); font-size: 34px; line-height: 1.05; }

		.mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 0 14px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
		.mode button { padding: 11px 0; border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 700; transition: background .15s, color .15s; }
		.mode button[aria-pressed="true"] { color: #000; background: var(--white); }

		.days { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 0 -14px 14px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; background: linear-gradient(var(--bg) 80%, transparent); }
		.day { position: relative; display: grid; gap: 3px; padding: 10px 0 9px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; transition: background .15s, transform .1s; }
		.day:active { transform: scale(.96); }
		.day span { font-size: 13px; font-weight: 800; color: var(--muted); }
		.day b { font-family: var(--serif); font-size: 19px; line-height: 1; }
		.day[aria-pressed="true"] { background: var(--white); border-color: var(--white); color: #000; }
		.day[aria-pressed="true"] span { color: rgba(0,0,0,.55); }
		.day.today::after { content: ""; position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

		.panel { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
		.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
		.panel-head h2 { margin: 0; font-family: var(--serif); font-size: 24px; text-transform: capitalize; }
		.panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
		.now { display: none; align-items: center; gap: 7px; padding: 7px 11px; color: #000; background: var(--white); border-radius: 20px; font-size: 12px; font-weight: 800; white-space: nowrap; }
		.now.on { display: inline-flex; }
		.now i { width: 7px; height: 7px; border-radius: 50%; background: #000; animation: pulse 1.4s infinite; }
		@keyframes pulse { 50% { opacity: .25; } }

		ol { list-style: none; margin: 0; padding: 0; }
		.lesson { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 14px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
		.lesson:last-child { border-bottom: 0; }
		.num { display: grid; place-items: center; width: 38px; height: 38px; background: var(--raised); border-radius: 50%; font-family: var(--serif); font-size: 16px; font-weight: 700; }
		.name { font-size: 17px; font-weight: 800; line-height: 1.25; }
		.time { margin-top: 4px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
		.room { min-width: 52px; padding: 8px 10px; text-align: center; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 800; }
		.lesson.past { opacity: .4; }
		.lesson.current { background: var(--raised); box-shadow: inset 4px 0 var(--white); }
		.lesson.current .num { background: var(--white); color: #000; }
		.lesson.current .room { background: var(--white); border-color: var(--white); color: #000; }
		.empty { padding: 44px 20px; color: var(--muted); text-align: center; font-size: 16px; }


		.rise { animation: rise .35s ease-out both; }
		@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
		@media (min-width: 560px) { .name { font-size: 18px; } }
	</style>
</head>
<body>
	<main class="page">
		<header class="week">
			<small id="week-src">Сейчас</small>
			<h1 id="week-name"></h1>
		</header>

		<div class="mode" role="group" aria-label="Выбор недели">
			<button type="button" data-mode="auto" aria-pressed="true">Авто</button>
			<button type="button" data-mode="odd" aria-pressed="false">Нечётная</button>
			<button type="button" data-mode="even" aria-pressed="false">Чётная</button>
		</div>

		<nav class="days" id="days" aria-label="Дни недели"></nav>

		<section class="panel">
			<header class="panel-head">
				<div>
					<h2 id="day-title"></h2>
					<p id="day-sub"></p>
				</div>
				<span class="now" id="now"><i></i>Идёт пара</span>
			</header>
			<ol id="list" aria-live="polite"></ol>
		</section>

	</main>

	<script>
		const days = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
		const shortDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
		const periods = ["8:00 – 9:30", "9:40 – 11:10", "11:30 – 13:00", "13:10 – 14:40", "14:50 – 16:20"];
		const schedule = {
			odd: [
				["Ко 2 паре", "3D графика", "Русский язык", "Программирование", "Программирование"],
				["География", "Математика", "Английский язык", "База данных", null],
				["Биология", "Химия", "Физкультура", "Русский язык", "Здоровый образ"],
				["Планирование", "Планирование", "Математика", "Румынский", null],
				["История", "Румынский", null, null, null],
				[null, null, null, null, null]
			],
			even: [
				["Здоровый образ", "3D графика", "Русский язык", "Программирование", "Программирование"],
				["География", "Математика", "Английский язык", "База данных", null],
				["Ко 2 паре", "Химия", "Физкультура", "Русский язык", "Биология"],
				["Математика", "Планирование", "Математика", null, null],
				["ЕПС", "Румынский", null, null, null],
				[null, null, null, null, null]
			]
		};
		const rooms = {
			odd: [
				["", "SC1", "104", "SC3", "SC3"], ["213", "108", "109", "208", ""],
				["", "112", "зал", "213", "112"], ["208", "208", "108", "", ""],
				["104", "104", "", "", ""], ["", "", "", "", ""]
			],
			even: [
				["112", "SC1", "104", "SC3", "SC3"], ["213", "108", "109", "208", ""],
				["", "112", "зал", "213", "112"], ["108", "208", "108", "", ""],
				["104", "104", "", "", ""], ["", "", "", "", ""]
			]
		};


		const $ = (s) => document.querySelector(s);
		const starts = [480, 580, 690, 790, 890];
		const ends = [570, 670, 780, 880, 980];
		const fmt = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
		let mode = "auto";
		let selectedDay = 0;

		function startOfWeek(date) {
			const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
			monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
			return monday;
		}

		function getAcademicParity(date) {
			const startYear = date.getMonth() >= 8 ? date.getFullYear() : date.getFullYear() - 1;
			const first = startOfWeek(new Date(startYear, 8, 1));
			const elapsed = Math.round((startOfWeek(date) - first) / 604800000);
			return Math.abs(elapsed) % 2 === 0 ? "odd" : "even";
		}

		const getParity = () => mode === "auto" ? getAcademicParity(new Date()) : mode;
		const todayIndex = () => (new Date().getDay() + 6) % 7;

		function renderDays() {
			const monday = startOfWeek(new Date());
			$("#days").innerHTML = shortDays.map((d, i) => {
				const date = new Date(monday);
				date.setDate(monday.getDate() + i);
				return `<button type="button" class="day${i === todayIndex() ? " today" : ""}" data-day="${i}" aria-pressed="${i === selectedDay}" aria-label="${days[i]}"><span>${d}</span><b>${date.getDate()}</b></button>`;
			}).join("");
		}

		function renderList(animate) {
			const parity = getParity();
			const now = new Date();
			const minutes = now.getHours() * 60 + now.getMinutes();
			const isToday = selectedDay === todayIndex();
			const items = schedule[parity][selectedDay].map((subject, i) => subject && { subject, i }).filter(Boolean);
			const current = isToday ? items.find(({ i }) => minutes >= starts[i] && minutes < ends[i]) : null;

			$("#day-title").textContent = days[selectedDay];
			$("#day-sub").textContent = items.length ? `${fmt(starts[items[0].i])}–${fmt(ends[items.at(-1).i])}` : "";
			$("#now").classList.toggle("on", Boolean(current));

			const list = $("#list");
			list.innerHTML = items.length ? items.map(({ subject, i }) => {
				const room = rooms[parity][selectedDay][i];
				const cls = current && current.i === i ? " current" : isToday && minutes >= ends[i] ? " past" : "";
				return `<li class="lesson${cls}">
					<span class="num">${i + 1}</span>
					<div><div class="name">${subject}</div><div class="time">${periods[i]}</div></div>
					${room ? `<span class="room">${room}</span>` : ""}
				</li>`;
			}).join("") : '<li class="empty">На этот день занятий нет</li>';
			if (animate) { list.classList.remove("rise"); void list.offsetWidth; list.classList.add("rise"); }
		}

		function render(animate = false) {
			const now = new Date();
			$("#week-name").textContent = (getParity() === "odd" ? "Нечётная" : "Чётная") + " неделя";
			$("#week-src").textContent = mode === "auto" ? "Сейчас" : "Выбрано вручную";
			document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
			renderDays();
			renderList(animate);
		}

		$("#days").addEventListener("click", (e) => {
			const b = e.target.closest("[data-day]");
			if (b) { selectedDay = +b.dataset.day; render(true); }
		});
		document.querySelector(".mode").addEventListener("click", (e) => {
			const b = e.target.closest("[data-mode]");
			if (b) { mode = b.dataset.mode; render(true); }
		});

		let sx = 0, sy = 0;
		document.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
		document.addEventListener("touchend", (e) => {
			const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
			if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
				selectedDay = Math.max(0, Math.min(5, selectedDay + (dx < 0 ? 1 : -1)));
				render(true);
			}
		}, { passive: true });

		selectedDay = todayIndex() > 5 ? 0 : todayIndex();
		render();
		setInterval(() => render(), 30000);
	</script>
</body>
</html>
